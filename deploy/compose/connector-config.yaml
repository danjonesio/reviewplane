# Connector configuration for the end-to-end development-environment fixture
# (docs/CONNECTOR_PROTOCOL.md section 20).
#
# This is what an operator writes on a real development VM, with the fixture's
# values filled in. It is mounted read-only into the dev-fixture container.

control_plane:
  url: https://api:8443
  tls:
    # The connector trust bundle: the control-plane CA that the control plane
    # serves its certificate from, and the tunnel gateway's own certificate.
    # The connector dials both peers, so it needs both anchors. run.sh writes
    # it from the API before starting this container, so the connector verifies
    # the control plane rather than trusting whatever answers.
    ca_file: /etc/reviewplane/tls/connector-trust.pem

identity:
  data_dir: /var/lib/reviewplane-connector

heartbeat:
  interval: 5s

workspaces:
  # The workspaces the connector serves and observes (section 9). The
  # identifier is the one a publication names, so it is configured rather than
  # discovered; the path is the checkout the fixture application is served from,
  # and it is the only path this connector ever looks at — broad filesystem
  # scanning is disabled and this build performs none.
  #
  # The path is a real Git repository, created in `examples/dev-fixture/
  # Dockerfile` and mounted writable by `compose.yaml`. That is load-bearing
  # rather than incidental: a directory that is not a checkout yields no
  # observation at all, and the end-to-end scenario used to insert the workspace
  # row by hand to stand in for the observation that was never going to arrive.
  # It now waits for `workspace.observed` and asserts the recorded head commit
  # against this checkout's actual HEAD.
  - id: wsp_fixture
    path: /opt/reviewplane/dev-fixture
    project: prj_fixture

git_context:
  # How often the connector re-observes the workspaces above. It matches the
  # heartbeat interval rather than the 30s default so that the end-to-end
  # scenario's bounded wait for `workspace.head_changed`, after it switches the
  # checkout's branch, is a few intervals rather than a few minutes.
  interval: 5s

publication:
  # The connector's own say over what it will carry, enforced independently of
  # the control plane and of the gateway (section 11). Loopback only, and only
  # the two ports the fixture applications bind.
  allowed_hosts:
    - 127.0.0.1
  allowed_ports:
    - 4321
    - 5173
  max_routes: 4
  allowed_projects:
    - prj_fixture

privacy:
  # All three are refused when true, each because this build cannot honour it:
  # the version 1 workspace_observation payload has no member that can carry a
  # changed-path list, the heartbeat resource summary permits only load and
  # available memory, and bounded root scanning is not implemented. A setting
  # accepted and quietly ignored would tell an operator their policy had been
  # applied when nothing about what is sent had changed
  # (docs/CONNECTOR_PROTOCOL.md sections 8, 9 and 20).
  report_changed_paths: false
  report_process_details: false
  discover_workspaces: false

logging:
  level: debug
  format: json
