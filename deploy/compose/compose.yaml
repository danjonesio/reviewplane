# ReviewPlane single-host deployment (ADR-0008).
#
# This is the supported installation, not an example. The rules
# `docs/DEPLOYMENT.md` section 20 says MUST be impossible in a shipped default
# are enforced here rather than left to the operator, because
# `docs/SECURITY.md` section 4 names administrator misconfiguration as a threat
# and a default that is only safe after an edit has already failed:
#
#   * only the edge gateway publishes host ports. It serves the web
#     application's static assets, proxies `/api` and `/mcp`, upgrades `/ws` to
#     the control plane, and refuses the worker channel outright. `api`, `mcp`,
#     `jobs`, the tunnel gateway, the worker and PostgreSQL publish nothing.
#   * Chromium runs in `browser-worker`, never in `api`.
#   * no container mounts the Docker socket.
#   * PostgreSQL is private; artefacts live on a private volume through the
#     filesystem driver, and no object-storage service is bundled (ADR-0012).
#   * the browser worker holds no database or artefact-store credential.
#   * secrets are mounted as files, never passed as environment values, and
#     none of them is committed: `./configure` generates them.
#
# The browser worker is the only component that executes untrusted page
# content, so its service block carries the `docs/SECURITY.md` section 10
# isolation controls: a non-root user, a read-only root filesystem, all
# capabilities dropped except the one Chromium's own sandbox needs, a seccomp
# profile that permits user-namespace creation and nothing else beyond
# Docker's default, and no route to the internet.
#
# Install it with `docs/DEPLOYMENT.md` section 8. Nothing here needs editing
# for a single-host installation to work.

name: reviewplane

# Every network but `frontend` is `internal: true`, so Docker attaches no
# gateway to it and nothing on it can reach the internet.
# `docs/ARCHITECTURE.md` section 6.2 permits "explicit network routes only", and
# these are the whole set: a component that is not on a network with a peer
# cannot reach that peer at all, which is a stronger statement than any firewall
# rule.
#
# `frontend` is the single exception and exists because publishing a host port
# requires one. Docker publishes a port by translating it into the container's
# address on a bridge that has a gateway, and `internal: true` is precisely the
# absence of one — a container on internal networks only gets no port mapping at
# all, silently. The edge gateway is the one component whose job is to be
# reachable from outside (section 4.1), so it is the one component that has it;
# everything it proxies to stays internal and reachable only through it.
networks:
  # Control plane and browser worker. The worker is on this and nothing else,
  # except the tunnel network it needs to reach the gateway.
  browser:
    internal: true
  # Control plane, background worker and PostgreSQL.
  data:
    internal: true
  # The browser worker's route to the tunnel gateway's browser-facing listener,
  # and the control plane's route to the gateway's admin API. The worker has no
  # route to the development environment: it reaches a published service only
  # through the gateway, which is what makes the route a capability for one
  # destination rather than network reach.
  tunnel:
    internal: true
  # The development environment's outbound route to the control plane (for
  # enrolment) and to the gateway (for its data channel). The connector dials
  # out on both; nothing dials in.
  devnet:
    internal: true
  # The edge gateway to the control plane and the MCP server. Internal: the edge
  # reaches them over this network and never over the host, and neither of them
  # gains a route to anywhere else by being on it.
  edge:
    internal: true
  # The edge gateway's own published port, and the only network in this file
  # that is not internal. Its only member is `gateway`. See the note above
  # `networks:` for why a published port cannot be served from an internal one.
  frontend:
    internal: false

volumes:
  # `docs/DEPLOYMENT.md` section 5. The names carry the project prefix at run
  # time (`reviewplane_postgres-data` and so on).
  postgres-data:
  artefact-data:
  caddy-data:
  # The connector certificate authority's certificate, written by `api` on
  # first start and read by `tunnel-gateway` (ADR-0014). The authority is
  # generated by the control plane and lives in PostgreSQL, so no installer can
  # produce this in advance; the gateway reads a file and refuses to start
  # without one. The private key is never here — signing happens in `api`.
  connector-ca:
  # The Vite fixture's own sources, seeded from the image the first time the
  # volume is attached. Used by the `development` profile only.
  #
  # `dev-fixture` runs with a read-only root filesystem, which is one of the
  # `docs/SECURITY.md` §10 controls and is not relaxed for a fixture. RVP-14's
  # hot-reload proof has to *edit a source file on the development machine*
  # while it is running, so exactly one path is made writable and it is the one
  # the proof edits. A bind mount of the repository would have done the same
  # job while writing into the developer's checkout, which a test must not do.
  dev-fixture-vite-src:
  # The development machine's Git checkout, seeded from the image the first time
  # the volume is attached. `development` profile only.
  #
  # It is a volume for the same reason `dev-fixture-vite-src` is: the container's
  # root filesystem is read-only, and this is a checkout somebody works in. The
  # connector only ever *reads* it, but the end-to-end scenario switches its
  # branch and makes a commit while the stack is running, which is how
  # `workspace.head_changed` is proved rather than assumed. A read-only checkout
  # could be observed and never moved, and an unmoved checkout proves half of
  # §9.
  #
  # The volume is discarded with the rest of the project at teardown, and the
  # scenario tears down its own project name before it starts, so every run
  # begins from the image's committed `main` rather than from whatever the last
  # run left behind.
  dev-fixture-workspace:

services:
  # PostgreSQL is pinned by digest rather than by tag, because
  # `docs/SECURITY.md` section 19 asks for a pinned supply chain and a tag is
  # mutable. The comment carries the version the digest is; the digest is what
  # is actually fetched.
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    networks: [data]
    environment:
      POSTGRES_DB: reviewplane
      POSTGRES_USER: reviewplane
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewplane -d reviewplane"]
      interval: 10s
      timeout: 5s
      retries: 12

  # The only service with a published port. It serves `apps/web`'s build
  # output, proxies `/api` and `/mcp`, upgrades `/ws` and refuses `/internal`
  # (`docs/ARCHITECTURE.md` section 4.1).
  gateway:
    image: ${REVIEWPLANE_IMAGE_PREFIX:-ghcr.io/danjonesio}/reviewplane-gateway:${REVIEWPLANE_VERSION:-0.1.0}
    # `build` is the default because no signed release image is published yet
    # (`docs/DEPLOYMENT.md` section 2). `./configure` sets this to `missing`
    # when the pinned release images resolve in the registry, and `missing` is
    # what a release installation runs with. `build` also makes
    # `docker compose pull` skip the service cleanly rather than fail on an
    # image that is meant to be built.
    pull_policy: ${REVIEWPLANE_PULL_POLICY:-build}
    build:
      context: ../..
      dockerfile: deploy/compose/gateway/Dockerfile
      args:
        REVIEWPLANE_VERSION: ${REVIEWPLANE_VERSION:-0.1.0}
        REVIEWPLANE_REVISION: ${REVIEWPLANE_REVISION:-unknown}
        REVIEWPLANE_BUILT_AT: ${REVIEWPLANE_BUILT_AT:-unknown}
    restart: unless-stopped
    # `frontend` carries the published port; `edge` carries the two upstreams.
    # The gateway is the only member of `frontend`, so it is the only container
    # in the stack with a route off the host.
    networks: [frontend, edge]
    depends_on:
      - api
      - mcp
    ports:
      - "${REVIEWPLANE_GATEWAY_PORT:-8443}:8443"
    environment:
      # The name the site is served under. A site address with no name gives
      # Caddy's internal authority no subject to issue a certificate for, and
      # every handshake fails; `localhost` is the single-host default and an
      # operator serving a real host names it here.
      REVIEWPLANE_GATEWAY_DOMAIN: ${REVIEWPLANE_GATEWAY_DOMAIN:-localhost}
      # `internal` is Caddy's own authority. An operator with a certificate
      # sets the two paths it and its key are mounted at.
      REVIEWPLANE_GATEWAY_TLS: ${REVIEWPLANE_GATEWAY_TLS:-internal}
    volumes:
      - caddy-data:/data
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true

  # The `api` role of `docs/ARCHITECTURE.md` section 4.2: the HTTP API,
  # authentication, domain logic and the connector listener. `reviewplane serve`
  # applies migrations before it opens its listener, which is what makes
  # `docker compose up -d` a complete installation step.
  api:
    image: ${REVIEWPLANE_IMAGE_PREFIX:-ghcr.io/danjonesio}/reviewplane-server:${REVIEWPLANE_VERSION:-0.1.0}
    pull_policy: ${REVIEWPLANE_PULL_POLICY:-build}
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
      args:
        REVIEWPLANE_VERSION: ${REVIEWPLANE_VERSION:-0.1.0}
        REVIEWPLANE_REVISION: ${REVIEWPLANE_REVISION:-unknown}
        REVIEWPLANE_BUILT_AT: ${REVIEWPLANE_BUILT_AT:-unknown}
    command: ["reviewplane", "serve"]
    restart: unless-stopped
    networks: [data, browser, tunnel, devnet, edge]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      REVIEWPLANE_HOST: 0.0.0.0
      REVIEWPLANE_PORT: "8080"
      REVIEWPLANE_DATABASE_URL_FILE: /run/secrets/database_url
      REVIEWPLANE_BOOTSTRAP_TOKEN_FILE: /run/secrets/bootstrap_token
      REVIEWPLANE_WORKER_CREDENTIAL_FILE: /run/secrets/worker_credential
      REVIEWPLANE_WORKER_COMMAND_CREDENTIAL_FILE: /run/secrets/worker_command_credential
      REVIEWPLANE_WORKER_ENDPOINT: http://browser-worker:8090
      REVIEWPLANE_ARTEFACT_PATH: /var/lib/reviewplane/artefacts
      # This stack runs the jobs role in its own container, so the API does not
      # also run it: a `jobs` container whose logs and readiness describe only
      # some of the background work is worse than no separation at all
      # (`docs/ARCHITECTURE.md` section 4.2).
      REVIEWPLANE_SERVE_RUNS_JOBS: "false"
      # The control plane mints route capabilities; the gateway verifies them.
      # Both read the same key, which is why it is one secret and not two.
      REVIEWPLANE_CAPABILITY_SIGNING_KEY_FILE: /run/secrets/capability_signing_key
      REVIEWPLANE_CAPABILITY_KEY_ID: stage0-a
      REVIEWPLANE_TUNNEL_CONTROL_URL: http://tunnel-gateway:8445
      REVIEWPLANE_TUNNEL_CONTROL_TOKEN_FILE: /run/secrets/tunnel_control_token
      REVIEWPLANE_INTERNAL_SUFFIX: internal.invalid
      # The connector listener the development environment enrols against.
      REVIEWPLANE_CONNECTOR_HOST: 0.0.0.0
      REVIEWPLANE_CONNECTOR_PORT: "8443"
      REVIEWPLANE_CONNECTOR_PUBLIC_URL: wss://api:8443
      # The data channel terminates at the tunnel gateway, not here: the control
      # plane never carries tunnelled bytes (docs/ARCHITECTURE.md section 4.6).
      REVIEWPLANE_CONNECTOR_DATA_URL: wss://tunnel-gateway:8444/connector/data
      REVIEWPLANE_CONNECTOR_TLS_HOSTS: api,localhost,127.0.0.1
      # The connector authority's certificate, for the tunnel gateway to trust
      # connector identities with (ADR-0014). Written on first start; the key
      # stays in the database and is never exported.
      REVIEWPLANE_CONNECTOR_CA_EXPORT_FILE: /var/lib/reviewplane/connector-ca/connector-ca.pem
      # Origins a browser may open the live WebSocket from. It is the edge
      # gateway's public URL: a viewer's page is served from there and nowhere
      # else.
      REVIEWPLANE_ALLOWED_ORIGINS: ${REVIEWPLANE_PUBLIC_ORIGIN:-https://localhost:8443}
      # The edge gateway terminates TLS, so the viewer session cookie is Secure.
      REVIEWPLANE_SECURE_COOKIES: "true"
      # The listener whose certificate expiry `reviewplane status` reports
      # (`docs/OPERATIONS.md` section 3). It is the edge gateway, reached over
      # the `edge` network; a deployment that terminates TLS in front of the
      # stack clears this and the section reports "not configured".
      REVIEWPLANE_STATUS_TLS_ENDPOINT: ${REVIEWPLANE_STATUS_TLS_ENDPOINT-gateway:8443}
      # The name presented in SNI by that probe. It is not decoration: a named
      # Caddy site holds a certificate for its name and no other, and answers a
      # handshake that asks for a different one with an internal-error alert. A
      # probe that dialled `gateway:8443` without this would report the
      # certificate as unreadable on a perfectly healthy gateway.
      REVIEWPLANE_GATEWAY_DOMAIN: ${REVIEWPLANE_GATEWAY_DOMAIN:-localhost}
    # Short syntax: `uid`, `gid` and `mode` on a secret reference are honoured
    # by Docker Swarm only. Plain Compose bind-mounts the file with the
    # permissions it has on the host, which is why ./configure writes them
    # readable by the service user rather than 0600.
    secrets:
      - database_url
      - bootstrap_token
      - worker_credential
      - worker_command_credential
      - capability_signing_key
      - tunnel_control_token
    volumes:
      - artefact-data:/var/lib/reviewplane/artefacts
      - connector-ca:/var/lib/reviewplane/connector-ca
    # The control plane never gets the Docker socket (AGENTS.md).
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    # Without this, `docker compose up --wait` returns as soon as the process
    # exists, which is before it has applied migrations and bound its listener.
    # Anything that then talks to the API races it and loses.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/ready').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # The `jobs` role of `docs/ARCHITECTURE.md` section 4.2: durable background
  # work, claimed with `SELECT ... FOR UPDATE SKIP LOCKED`.
  #
  # It reaches PostgreSQL and nothing else. It is not on `edge`, `browser`,
  # `tunnel` or `devnet`, and it holds no worker, capability or tunnel
  # credential, because background work is domain work: an outage of every other
  # component leaves it able to do its job.
  #
  # Started against a schema behind its code it reports itself not ready and
  # waits, rather than exiting into a restart loop (`docs/DEPLOYMENT.md`
  # section 11).
  jobs:
    image: ${REVIEWPLANE_IMAGE_PREFIX:-ghcr.io/danjonesio}/reviewplane-server:${REVIEWPLANE_VERSION:-0.1.0}
    pull_policy: ${REVIEWPLANE_PULL_POLICY:-build}
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
      args:
        REVIEWPLANE_VERSION: ${REVIEWPLANE_VERSION:-0.1.0}
        REVIEWPLANE_REVISION: ${REVIEWPLANE_REVISION:-unknown}
        REVIEWPLANE_BUILT_AT: ${REVIEWPLANE_BUILT_AT:-unknown}
    command: ["reviewplane", "jobs"]
    restart: unless-stopped
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy
      # The API applies the schema. Waiting for it here is what turns "not ready
      # until the schema catches up" from a state an operator has to interpret
      # into one Compose resolves on its own.
      api:
        condition: service_healthy
    environment:
      REVIEWPLANE_DATABASE_URL_FILE: /run/secrets/database_url
      REVIEWPLANE_JOBS_HEALTH_HOST: 0.0.0.0
      REVIEWPLANE_JOBS_HEALTH_PORT: "8081"
    secrets:
      - database_url
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health/ready').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # The agent-facing interface. It is a separate process and route from the
  # control-plane API (`docs/ARCHITECTURE.md` section 4.4) and reaches the
  # gateway on `/mcp/*` only. ADR-0020 keeps it a separate image rather than a
  # second command on the server image, so the two can be scaled, restarted and
  # read in logs independently.
  #
  # It joins `data` because it translates MCP tools into domain commands
  # directly, and `browser` because `browser_take_screenshot` sends a command to
  # the worker. It is the same trust zone as `api`, which is why it may hold
  # the worker command credential — and it is *not* given the bootstrap token,
  # because an agent-facing process has no administrative work to do.
  mcp:
    image: ${REVIEWPLANE_IMAGE_PREFIX:-ghcr.io/danjonesio}/reviewplane-mcp-server:${REVIEWPLANE_VERSION:-0.1.0}
    pull_policy: ${REVIEWPLANE_PULL_POLICY:-build}
    build:
      context: ../..
      dockerfile: apps/mcp-server/Dockerfile
      args:
        REVIEWPLANE_VERSION: ${REVIEWPLANE_VERSION:-0.1.0}
        REVIEWPLANE_REVISION: ${REVIEWPLANE_REVISION:-unknown}
        REVIEWPLANE_BUILT_AT: ${REVIEWPLANE_BUILT_AT:-unknown}
    restart: unless-stopped
    # The tunnel network is here for one reason: `development_service_unpublish`
    # must reach the gateway's control listener. The gateway verifies a route
    # capability from its signature without a database read, so a record marked
    # revoked while the gateway still carried the route would be a revocation of
    # nothing (RVP-24). This process reaches the gateway's control API and
    # nothing else on that network: it holds no connector channel, and a
    # publication it requests is completed by `api` (ADR-0021).
    networks: [data, browser, edge, tunnel]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      REVIEWPLANE_MCP_LISTEN_ADDRESS: 0.0.0.0
      REVIEWPLANE_MCP_PORT: "8081"
      REVIEWPLANE_MCP_PATH: /mcp/v1
      REVIEWPLANE_DATABASE_URL_FILE: /run/secrets/database_url
      REVIEWPLANE_WORKER_COMMAND_CREDENTIAL_FILE: /run/secrets/worker_command_credential
      REVIEWPLANE_WORKER_ENDPOINT: http://browser-worker:8090
      REVIEWPLANE_ARTEFACT_PATH: /var/lib/reviewplane/artefacts
      REVIEWPLANE_API_PATH_PREFIX: /api/v1
      REVIEWPLANE_TUNNEL_CONTROL_URL: http://tunnel-gateway:8445
      REVIEWPLANE_TUNNEL_CONTROL_TOKEN_FILE: /run/secrets/tunnel_control_token
      REVIEWPLANE_INTERNAL_SUFFIX: internal.invalid
    secrets:
      - database_url
      - worker_command_credential
      - tunnel_control_token
    volumes:
      # Read-only: the MCP server serves evidence and never writes it. The
      # browser worker uploads through the control-plane API (ADR-0012).
      - artefact-data:/var/lib/reviewplane/artefacts:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health/live').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  browser-worker:
    image: ${REVIEWPLANE_IMAGE_PREFIX:-ghcr.io/danjonesio}/reviewplane-browser-worker:${REVIEWPLANE_VERSION:-0.1.0}
    pull_policy: ${REVIEWPLANE_PULL_POLICY:-build}
    build:
      context: ../..
      dockerfile: apps/browser-worker/Dockerfile
      args:
        REVIEWPLANE_VERSION: ${REVIEWPLANE_VERSION:-0.1.0}
        REVIEWPLANE_REVISION: ${REVIEWPLANE_REVISION:-unknown}
        REVIEWPLANE_BUILT_AT: ${REVIEWPLANE_BUILT_AT:-unknown}
    restart: unless-stopped
    # The browser network reaches the control plane; the tunnel network reaches
    # the gateway. Neither reaches the data network, the development
    # environment or the internet. A published service is reachable only
    # through the gateway, so the route is a capability for one destination
    # rather than network reach (ADR-0015).
    networks: [browser, tunnel]
    depends_on:
      # The worker registers with the control plane as it starts and exits if it
      # cannot. Starting it first turns a deterministic ordering into a restart
      # loop that usually recovers, which is the worst of both.
      api:
        condition: service_healthy
    environment:
      REVIEWPLANE_WORKER_NAME: browser-worker-01
      REVIEWPLANE_WORKER_LISTEN_ADDRESS: 0.0.0.0
      REVIEWPLANE_WORKER_PORT: "8090"
      REVIEWPLANE_WORKER_CAPACITY: ${REVIEWPLANE_WORKER_CAPACITY:-4}
      # docs/SECURITY.md section 10: the Chromium sandbox stays enabled.
      REVIEWPLANE_WORKER_SANDBOX: ${REVIEWPLANE_WORKER_SANDBOX:-required}
      REVIEWPLANE_WORKER_SESSION_ROOT: /var/lib/reviewplane/browser-sessions
      REVIEWPLANE_CONTROL_PLANE_URL: http://api:8080
      REVIEWPLANE_WORKER_CREDENTIAL_FILE: /run/secrets/worker_credential
      REVIEWPLANE_WORKER_COMMAND_CREDENTIAL_FILE: /run/secrets/worker_command_credential
      REVIEWPLANE_WORKER_SESSION_DURATION_SECONDS: ${REVIEWPLANE_WORKER_SESSION_DURATION_SECONDS:-7200}
      # ADR-0015: the internal origin is a reserved TLD with no DNS and a
      # certificate no public authority can vouch for. Chromium is given a
      # static mapping to the gateway and a pin for exactly its public key.
      # Both are set together or the worker refuses to start.
      REVIEWPLANE_INTERNAL_SUFFIX: internal.invalid
      REVIEWPLANE_TUNNEL_GATEWAY_ADDRESS: tunnel-gateway:8443
      REVIEWPLANE_TUNNEL_CERTIFICATE_SPKI: ${REVIEWPLANE_TUNNEL_CERTIFICATE_SPKI:?run ./configure first}
    # The worker holds two credentials and neither reaches storage or the
    # database (ADR-0012, `docs/SECURITY.md` section 10.2). There is
    # deliberately no `database_url` here and no artefact volume below.
    secrets:
      - worker_credential
      - worker_command_credential
    # No port is published to the host: the worker is reachable only from the
    # control plane, and no Chromium debugging port is exposed anywhere
    # (AGENTS.md "Mandatory engineering rules").
    read_only: true
    tmpfs:
      # Per-session ephemeral profile directories. On a tmpfs they never touch
      # the host disk, and they are removed on termination in any case.
      - /var/lib/reviewplane/browser-sessions:size=2g,mode=0700,uid=10001,gid=10001
      - /tmp:size=512m,mode=1777
      - /home/reviewplane:size=64m,mode=0700,uid=10001,gid=10001
    user: "10001:10001"
    cap_drop: [ALL]
    # Chromium's namespace sandbox chroots itself into an empty directory
    # inside its new user namespace. That is the single capability it needs,
    # and dropping it is what forces the unsupported --no-sandbox workaround.
    cap_add: [SYS_CHROOT]
    security_opt:
      - no-new-privileges:true
      # Docker's default profile with one change: clone, clone3 and unshare
      # are ungated, because that is what Chromium's sandbox is built on.
      # Every other gate, including CAP_SYS_ADMIN on mount, pivot_root and
      # setns, is untouched. Without it Chromium reports "No usable sandbox".
      - seccomp:./browser-worker-seccomp.json
    # Chromium's shared-memory use is heavy; the default 64 MB /dev/shm makes
    # renderers crash rather than making them safer.
    shm_size: 1gb
    mem_limit: ${REVIEWPLANE_WORKER_MEMORY_LIMIT:-4g}
    pids_limit: 512
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/internal/v1/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      # Chromium is downloaded into the image, but the first launch still costs
      # seconds on a small host.
      start_period: 60s

  # The tunnel gateway: the only component both the browser worker and the
  # development environment can reach. It is a static binary in a distroless
  # image with no shell and no package manager, so the blast radius of the one
  # process that terminates both untrusted-ish sides is as small as an image can
  # make it. It publishes no host port.
  tunnel-gateway:
    image: ${REVIEWPLANE_IMAGE_PREFIX:-ghcr.io/danjonesio}/reviewplane-tunnel-gateway:${REVIEWPLANE_VERSION:-0.1.0}
    pull_policy: ${REVIEWPLANE_PULL_POLICY:-build}
    build:
      context: ../..
      dockerfile: services/tunnel-gateway/Dockerfile
      args:
        REVIEWPLANE_VERSION: ${REVIEWPLANE_VERSION:-0.1.0}
        REVIEWPLANE_REVISION: ${REVIEWPLANE_REVISION:-unknown}
        REVIEWPLANE_BUILT_AT: ${REVIEWPLANE_BUILT_AT:-unknown}
    restart: unless-stopped
    networks: [tunnel, devnet]
    depends_on:
      # Healthy, not merely started: the gateway trusts connector identities
      # against an authority the control plane generates on its first start, and
      # a gateway that came up before that file existed would restart until it
      # did (ADR-0014).
      api:
        condition: service_healthy
    environment:
      # Browser-facing listener. The worker resolves every *.internal.invalid
      # name here (ADR-0015).
      REVIEWPLANE_TUNNEL_LISTEN_ADDRESS: 0.0.0.0:8443
      # Connector data channel, mutually authenticated against the connector CA.
      REVIEWPLANE_TUNNEL_CONNECTOR_LISTEN_ADDRESS: 0.0.0.0:8444
      # Admin API and metrics, reachable from the control plane only.
      REVIEWPLANE_TUNNEL_ADMIN_LISTEN_ADDRESS: 0.0.0.0:8445
      REVIEWPLANE_TUNNEL_INTERNAL_SUFFIX: internal.invalid
      REVIEWPLANE_TUNNEL_ADMIN_TOKEN_FILE: /run/secrets/tunnel_control_token
      REVIEWPLANE_TUNNEL_CAPABILITY_KEYS_FILE: /run/secrets/capability_keys
      REVIEWPLANE_TUNNEL_CONNECTOR_CA_FILE: /var/lib/reviewplane/connector-ca/connector-ca.pem
      REVIEWPLANE_TUNNEL_TLS_CERT_FILE: /etc/reviewplane/tls/gateway.crt
      REVIEWPLANE_TUNNEL_TLS_KEY_FILE: /etc/reviewplane/tls/gateway.key
      # docs/CONNECTOR_PROTOCOL.md section 13: header rewriting is fixed in
      # configuration, never decided per request. `upstream` is the default
      # because a development server's DNS-rebinding protection accepts
      # loopback and refuses an unfamiliar name.
      REVIEWPLANE_TUNNEL_HOST_HEADER_MODE: ${REVIEWPLANE_TUNNEL_HOST_HEADER_MODE:-upstream}
      REVIEWPLANE_TUNNEL_FORWARDED_HEADER_MODE: standard
    secrets:
      - tunnel_control_token
      - capability_keys
    volumes:
      # Generated by ./configure and never committed.
      - ./tls:/etc/reviewplane/tls:ro
      # Written by `api` on first start, read-only here (ADR-0014).
      - connector-ca:/var/lib/reviewplane/connector-ca:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"

  # The development environment: an agent's VM, standing in for a real one.
  #
  # It is in the `development` profile, so the default installation of
  # `docs/DEPLOYMENT.md` section 8 does not start it — `docs/DEPLOYMENT.md`
  # section 6 requires the default installation to need no profile. In a real
  # deployment the connector is a static binary on a developer's machine, not a
  # container; it is containerised here so the end-to-end scenario can run
  # unattended.
  #
  # It publishes NO port: `docs/PROJECT.md` section 9 and Stage 0 exit criterion
  # 5 say no inbound port is required on a development VM, and this service
  # block is where that claim is either true or a lie. There is deliberately no
  # `ports:` key and no `expose:`.
  dev-fixture:
    image: ${REVIEWPLANE_IMAGE_PREFIX:-ghcr.io/danjonesio}/reviewplane-dev-fixture:${REVIEWPLANE_VERSION:-0.1.0}
    pull_policy: ${REVIEWPLANE_PULL_POLICY:-build}
    build:
      context: ../..
      dockerfile: examples/dev-fixture/Dockerfile
      args:
        REVIEWPLANE_VERSION: ${REVIEWPLANE_VERSION:-0.1.0}
        REVIEWPLANE_REVISION: ${REVIEWPLANE_REVISION:-unknown}
        REVIEWPLANE_BUILT_AT: ${REVIEWPLANE_BUILT_AT:-unknown}
    profiles: [development]
    networks: [devnet]
    depends_on:
      api:
        condition: service_started
      tunnel-gateway:
        condition: service_started
    environment:
      REVIEWPLANE_CONTROL_PLANE_URL: https://api:8443
      # The trust bundle, not the connector CA alone: the connector dials two
      # peers with two different authorities, and this value becomes the
      # connector's --ca-file, which overrides the configuration file.
      REVIEWPLANE_CONTROL_PLANE_CA_FILE: /etc/reviewplane/tls/connector-trust.pem
      REVIEWPLANE_ENROLMENT_TOKEN_FILE: /run/secrets/enrolment_token
      PORT: "4321"
      # The Vite development server on 127.0.0.1:5173, beside the static
      # application on 4321. It is what makes the RVP-14 hot-reload proof
      # possible: a real dev server with a real file watcher and a real update
      # socket. Set it to "0" for a run that only needs the static application.
      REVIEWPLANE_FIXTURE_VITE: "1"
      # Vite's dependency-optimisation cache, redirected onto the tmpfs below.
      # The root filesystem is read-only, so the default cache directory inside
      # the project is not writable and the dev server would fail to start.
      VITE_CACHE_DIR: /tmp/vite-cache
    secrets:
      - enrolment_token
    volumes:
      - ./tls:/etc/reviewplane/tls:ro
      # The generated copy, not the template: a project identifier is minted by
      # the control plane, and the connector refuses a publication for a project
      # it does not serve. `./configure --development` seeds it from
      # connector-config.yaml; the end-to-end script rewrites it with the real
      # identifier before this service starts.
      - ./connector-config.generated.yaml:/etc/reviewplane-connector/config.yaml:ro
      # The one writable Vite source path. RVP-14 edits a file here while the
      # stack is running and watches the change reach central Chromium without a
      # full page reload. It is deliberately *outside* the checkout below, so
      # that the hot-reload edit does not dirty the working tree and emit a
      # workspace observation the branch-switch proof did not cause.
      - dev-fixture-vite-src:/app/vite-app/src
      # The checkout the connector observes and the static application is served
      # from, seeded from the image. Writable so that the end-to-end scenario can
      # move HEAD (RVP-80); the connector itself never writes to it — every git
      # invocation it makes disables optional locks and automatic garbage
      # collection (`docs/CONNECTOR_PROTOCOL.md` §9).
      - dev-fixture-workspace:/opt/reviewplane/dev-fixture
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /var/lib/reviewplane-connector:size=16m,mode=0700,uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"

# `docs/DEPLOYMENT.md` section 7: secret material is mounted as a file and never
# passed as an environment value. None of these is committed — `secrets/` is
# ignored except for its `.gitkeep` — and `./configure` generates every one of
# them. A missing file makes Compose refuse to start the stack, which is the
# intended failure: a control plane that started without its signing key would
# mint capabilities nothing could verify.
secrets:
  postgres_password:
    file: ./secrets/postgres_password
  database_url:
    file: ./secrets/database_url
  bootstrap_token:
    file: ./secrets/bootstrap_token
  worker_credential:
    file: ./secrets/worker_credential
  worker_command_credential:
    file: ./secrets/worker_command_credential
  # One key, two readers: the control plane signs a capability with it and the
  # tunnel gateway verifies with it. The gateway's form carries the key
  # identifier because it holds a keyring and has to select by `kid`.
  capability_signing_key:
    file: ./secrets/capability_signing_key
  capability_keys:
    file: ./secrets/capability_keys
  tunnel_control_token:
    file: ./secrets/tunnel_control_token
  enrolment_token:
    file: ./secrets/enrolment_token
