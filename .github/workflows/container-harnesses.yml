name: Container harnesses

# The suites `docs/DEVELOPMENT.md` section 5 lists as container harnesses:
# `pnpm test:browser`, `test:ui`, `test:integration`, `test:e2e`, `test:edge`
# and `test:install`. Each one builds at least one image and runs Chromium or
# the whole Compose stack, so they cost minutes where the gates in `ci.yml` cost
# seconds.
#
# They run nightly, on demand, and on any pull request that is not
# documentation-only. RVP-73: the earlier trigger set ran them on a pull request
# only when it carried the `ci:harnesses` label, which failed open — a protocol
# change merged without them and left `pnpm test:integration` broken on `main`
# until an unrelated pull request happened to carry the label. Remembering a
# label is not a control, so the default is now to run them and the exemption is
# narrow and mechanical.
#
# The filter is computed in the `scope` job rather than declared as
# `on.pull_request.paths`, deliberately. A workflow that `paths` filters out
# does not run at all, so it reports nothing, and a check that reports nothing
# cannot be distinguished from a check nobody added. Deciding inside the
# workflow means the `Harness gates` job below reports a conclusion on every
# pull request: green when the harnesses passed, green when the change could not
# have affected them and says which files led to that, and red when a harness
# that was required did not run or did not succeed.
#
# Every action is pinned to a commit for the reason `ci.yml` gives.

on:
  schedule:
    # Nightly, off the hour: a scheduled run on the hour queues behind everyone
    # else's.
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    # `labeled` stays in the list so that adding `ci:harnesses` to a pull request
    # the filter exempted runs them without an empty commit.
    types: [opened, reopened, synchronize, labeled]

concurrency:
  group: harnesses-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  scope:
    name: Decide scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      # Only a pull request needs the history: every other event runs
      # everything, and fetching for it would be work done to reach a conclusion
      # already known.
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The three-dot diff below needs the merge base, so the full history
          # of both parents of the merge commit has to be present.
          fetch-depth: 0

      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'ci:harnesses') }}
        run: |
          set -euo pipefail

          decide() {
            printf 'run=%s\n' "$1" >> "${GITHUB_OUTPUT}"
            printf 'reason=%s\n' "$2" >> "${GITHUB_OUTPUT}"
            printf '**Harnesses run: %s.** %s\n' "$1" "$2" >> "${GITHUB_STEP_SUMMARY}"
            printf '%s\n' "$2"
            exit 0
          }

          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            decide true "A ${EVENT_NAME} run exercises every harness."
          fi

          if [[ "${LABELLED}" == "true" ]]; then
            decide true "The pull request carries the ci:harnesses label."
          fi

          # A diff that cannot be computed decides towards running the
          # harnesses. The failure this workflow exists to prevent is a harness
          # that silently did not run, so every uncertain case costs runner
          # minutes rather than assurance.
          if ! CHANGED="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}" 2>&1)"; then
            printf '%s\n' "${CHANGED}" >&2
            decide true "The changed-file list could not be computed, so the harnesses run."
          fi

          if [[ -z "${CHANGED}" ]]; then
            decide false "The pull request changes no files."
          fi

          # Documentation is the only exemption, and it is expressed as
          # everything the harnesses cannot read rather than as a list of the
          # trees they can. An allowlist of code paths is wrong the day someone
          # adds a directory it does not name, and being wrong that way means
          # not running — which is the defect this replaces. No harness reads a
          # tracked Markdown file or anything under `docs/`; every other path,
          # including `.github/workflows/`, `package.json`, `pnpm-lock.yaml`,
          # `.gitignore` (which decides what `pnpm test:install` copies into its
          # clean checkout) and every Dockerfile, can change what they do.
          # Every file is reported with the verdict it was given, so that a
          # decision anybody disagrees with can be argued about from the run
          # rather than reconstructed from the patterns.
          printf '### Changed files\n\n' >> "${GITHUB_STEP_SUMMARY}"
          CODE=""
          while IFS= read -r file; do
            [[ -n "${file}" ]] || continue
            case "${file}" in
              # Every tracked Markdown document, wherever it lives, and
              # everything under `docs/`, including its evidence images.
              *.md|docs/*) kind=documentation ;;
              *) kind=code; CODE+="${file}"$'\n' ;;
            esac
            printf -- '- %s — %s\n' "${file}" "${kind}" >> "${GITHUB_STEP_SUMMARY}"
          done <<< "${CHANGED}"
          printf '\n' >> "${GITHUB_STEP_SUMMARY}"

          if [[ -z "${CODE}" ]]; then
            decide false "Documentation only: every changed file is a Markdown document or lives under docs/."
          fi

          COUNT="$(printf '%s' "${CODE}" | grep -c . || true)"
          FIRST="$(printf '%s' "${CODE}" | head -n 1)"
          decide true "${COUNT} changed file(s) are not documentation, starting with ${FIRST}."

  browser:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    name: pnpm test:browser
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      # The harness bind-mounts the working tree into the worker image and runs
      # the suite from there, so the workspace has to be installed on the host
      # first.
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:browser

  ui:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    name: pnpm test:ui
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # The harness builds the web bundle itself before driving it.
      - run: pnpm test:ui

  integration:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    name: pnpm test:integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Steps 9 to 12 of `docs/TESTING.md` section 3, against a real database, a
      # real control plane, a real MCP server and a real browser worker.
      - run: pnpm test:integration

  e2e:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    name: pnpm test:e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # `deploy/compose/e2e/run.sh` needs docker, docker compose v2, openssl and
      # python3; the hosted runner has all four.
      - run: pnpm test:e2e

  edge:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    name: pnpm test:edge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # The edge gateway's own TLS, document, refusal and header behaviour.
      # Every other suite runs behind the gateway rather than through it, so
      # nothing else fails when the gateway itself does.
      - run: pnpm test:edge

  install:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    name: pnpm test:install
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # `docs/DEPLOYMENT.md` section 8, run verbatim from a clean checkout, plus
      # the negative checks section 20 says must hold in a shipped default: only
      # the gateway publishes a host port, PostgreSQL and the Chromium debugging
      # port are unreachable from the host, no service mounts the Docker socket,
      # and the browser worker runs non-root with the sandbox enabled.
      - run: pnpm test:install

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install-evidence
          path: deploy/compose/e2e/evidence-install
          if-no-files-found: ignore

  gates:
    # One check that reports on every run, so that a harness which did not run
    # is a visible red rather than an absence nobody reads. It is green only
    # when every harness that was required succeeded, and green without them
    # only when `scope` recorded why they were not required. It is the status
    # check to require on `main` alongside `CI gates` (AGENTS.md, "Change
    # delivery"), so that adding a harness does not mean editing the ruleset.
    name: Harness gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [scope, browser, ui, integration, e2e, edge, install]
    steps:
      - name: Refuse a run in which a required harness did not succeed
        env:
          REQUIRED: ${{ needs.scope.outputs.run }}
          REASON: ${{ needs.scope.outputs.reason }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail

          printf 'Scope: %s\n' "${REASON:-the scope job recorded no reason}"
          jq -r 'to_entries[] | "  \(.key): \(.value.result)"' <<< "${RESULTS}"

          # Without a scope decision nothing below can be interpreted: a skipped
          # harness could mean "not required" or "the decision crashed".
          if [[ "$(jq -r '.scope.result' <<< "${RESULTS}")" != "success" ]]; then
            echo "::error::The scope job did not succeed, so no harness can be shown to have run for the right reason."
            exit 1
          fi

          status=0
          while IFS='=' read -r job result; do
            case "${result}" in
              success)
                ;;
              skipped)
                if [[ "${REQUIRED}" == "true" ]]; then
                  echo "::error::${job} did not run, and this change is one the harnesses cover."
                  status=1
                fi
                ;;
              *)
                echo "::error::${job} reported ${result}."
                status=1
                ;;
            esac
          done < <(jq -r 'del(.scope) | to_entries[] | "\(.key)=\(.value.result)"' <<< "${RESULTS}")

          if [[ "${status}" -eq 0 && "${REQUIRED}" != "true" ]]; then
            printf 'No harness was required: %s\n' "${REASON}"
          fi

          exit "${status}"
